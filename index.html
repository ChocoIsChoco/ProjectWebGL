<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>three_vite_xr_ts</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="./main.css">
</head>

<body>
   <div id="overlay">
      <div class="controls">
          <h1>Visualiseur Audio 3D</h1>
          <input type="file" id="audioFile" accept="audio/*" />
          <button id="startButton">Démarrer</button>
      </div>
  </div>

  <div id="ui-controls">
      <button id="pauseButton">Pause</button>
      <button id="continueButton">Reprendre</button>
      <button id="stopButton">Arrêter</button>
  </div>
  <div id="container"></div>
  <div id="info">
      <p>Chargez un fichier audio et démarrez le visualiseur</p>
  </div>
  <!--
  <script src="./jsm/libs/ammo.wasm.js"></script>
  -->
  <script type="module" src="./main.ts"></script>
</body>

</html>
